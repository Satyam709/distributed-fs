syntax = "proto3";
package proto.storage.v1;

// path for generated go-package
option go_package = "github.com/satyam709/gen/pb_storage";

/*
   PutChunkRequest - represents the structure of individual frame of a chunk stream
*/
message PutChunkRequest {
  string chunk_id = 1;
  string file_id = 2;
  repeated NodeInfo replicate_to = 3;
  // 32kb frame of 4mb chunk
  bytes data = 4;
  // Checksum of this frame (SHA256)
  bytes checksum = 5;
  // signals the end of the stream
  bool is_last = 6;
}

/*
   PutChunkResponse - represents the response for a chunk upload frame
*/
message PutChunkResponse {
  // General response
  optional Response response = 1;

  // Rest of the data
  string chunk_id = 2;
  // 32kb frame of 4mb chunk
  bytes checksum = 3;
}

/*
   Response - general embedded fields present in all server responses
*/
message Response {
  int32 code = 1;
  string msg = 2;
  optional string error = 3;
}

/*
   GetChunkRequest - request structure for fetching a chunk by id
*/
message GetChunkRequest {
  string chunk_id = 1;
}

/*
   GetChunkResponse - response structure for a chunk frame sent to client
*/
message GetChunkResponse {
  // General response
  optional Response response = 1;
  // chunk uid
  string chunk_id = 2;
  // 32kb frame of 4mb chunk
  bytes data = 3;
  // Checksum of this frame (SHA256)
  bytes checksum = 4;
  // signals the end of the stream
  bool is_last = 5;
}

/*
   DeleteChunkRequest - request structure for deleting a chunk by id
*/
message DeleteChunkRequest {
  string chunk_id = 1;
}

/*
   DeleteChunkResponse - response structure for chunk deletion
*/
message DeleteChunkResponse {
  optional Response response = 1;
  bool success = 2;
}

/*
   VerifyChunkRequest - request structure for verifying chunk integrity
*/
message VerifyChunkRequest {
  string chunk_id = 1;
  bytes checksum = 4;
}

/*
   VerifyChunkResponse - response structure for chunk verification result
*/
message VerifyChunkResponse {
  optional Response response = 1;
  bool is_valid = 2;
}

message NodeInfo {
  string address = 1;
}

/*
   ReplicateChunkRequest - one frame sent from a source storage node to a replica.
   The first frame carries is_first=true and the chunk_id.
   Each subsequent frame carries data.
   The last frame has is_last=true.
*/
message ReplicateChunkRequest {
  string chunk_id = 1;
  int64 offset = 2;
  bytes data = 3;
  bool is_first = 4;
  bool is_last = 5;
}

/*
   ReplicateChunkResponse - sent by the receiving node back to the sender.
   Per-frame ack (ok=true) provides flow control.
   The final response (is_final=true) contains the checksum the receiver computed.
*/
message ReplicateChunkResponse {
  bool ok = 1;
  bool is_final = 2;
  string chunk_id = 3;
  bytes checksum = 4;
}

// StorageService (clients → storage nodes)
service StorageService {
  // stream client -> node
  rpc PutChunk(stream PutChunkRequest) returns (PutChunkResponse);
  // streams the requested chunk to the client
  rpc GetChunk(GetChunkRequest) returns (stream GetChunkResponse);
  rpc DeleteChunk(DeleteChunkRequest) returns (stream DeleteChunkResponse);
  rpc VerifyChunk(VerifyChunkRequest) returns (VerifyChunkResponse);
}

// ReplicationService (storage node → storage node, internal only)
service ReplicationService {
  // Bidirectional stream for P2P chunk replication.
  // Receiver acks each frame for flow control; sender slows if receiver is overwhelmed.
  // Final response carries the checksum the receiver computed.
  rpc ReplicateChunk(stream ReplicateChunkRequest) returns (stream ReplicateChunkResponse);
}
