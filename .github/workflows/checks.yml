name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for buf breaking

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Setup Buf
        uses: bufbuild/buf-setup-action@v1

      # -------- PROTO CHECKS --------

      - name: Check proto formatting
        run: buf format --diff --exit-code

      - name: Lint proto
        run: buf lint

      - name: Breaking change check (PR only)
        if: github.event_name == 'pull_request'
        run: buf breaking --against '.git#branch=main'

      - name: Generate proto code
        run: buf generate

      # -------- GO CHECKS --------

      - name: Download Go deps
        run: go mod tidy

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...